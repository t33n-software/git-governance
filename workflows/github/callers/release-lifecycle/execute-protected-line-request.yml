name: Execute Protected-Line Request

run-name: Execute protected-line request ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Durable release-request identifier authorized by the request controller.
        required: true
        type: string
      recovery:
        description: Read-only recovery finalization of a verification-pending request on the main line.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: protected-line-request-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  execute:
    name: Release execution
    permissions:
      actions: read
      contents: write
      deployments: write
    uses: t33n-software/git-governance/.github/workflows/reusable-execute-protected-line-request.yml@4573d36bbf928221e6d38e151e68aec6c168bb04
    with:
      request_id: ${{ inputs.request_id }}
      recovery: ${{ inputs.recovery }}
      repository: ${{ github.repository }}
      execution_environment: release-execution
      governance_repository: t33n-software/git-governance
      governance_ref: ${{ vars.GIT_GOVERNANCE_SOURCE_REF }}
