name: CI

on:
  push:
    branches: [main, develop, "release/**", "support/**"]
  pull_request:
    branches: [main, develop, "release/**", "support/**"]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Quality gates
    permissions:
      contents: read
    uses: t33n-software/repository-governance/.github/workflows/reusable-ci-go.yml@38c8ea236b858828b4d0134e04577117f96d4879
    with:
      quality_class: full
