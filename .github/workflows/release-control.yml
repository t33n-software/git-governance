name: Governed Release Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify the broker, authorize a protected release or support-line request, align a delivered release, or publish a validated reconciliation resolution.
        required: true
        type: choice
        options:
          - broker-smoke
          - release-request
          - reconciliation-align
          - reconciliation-resume
      version:
        description: Release SemVer or support major.minor version without a leading v; required for release-request.
        required: false
        type: string
      kind:
        description: Protected line kind; required for release-request.
        required: false
        type: choice
        options:
          - release
          - support
      release:
        description: Delivered release/<semver> line; required for reconciliation operations.
        required: false
        type: string
      ticket_key:
        description: Ticket key for release-request and reconciliation operations.
        required: false
        type: string
      ticket:
        description: Ticket number for release-request and reconciliation operations.
        required: false
        type: string
      slug:
        description: Kebab-case reconciliation preparation description.
        required: false
        type: string
      resolution_branch:
        description: Ticket-bound resolved reconciliation branch; required for reconciliation-resume.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-control-${{ inputs.version || inputs.release || github.ref }}
  cancel-in-progress: false

jobs:
  broker-smoke:
    if: ${{ inputs.operation == 'broker-smoke' }}
    name: Verify release credential broker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-credential-verification
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Require broker configuration
        shell: bash
        env:
          BROKER_URL: ${{ vars.GCP_RELEASE_CREDENTIAL_VERIFICATION_BROKER_URL }}
          WIF_PROVIDER: ${{ vars.GCP_RELEASE_CREDENTIAL_VERIFICATION_WIF_PROVIDER }}
          INVOKER_SERVICE_ACCOUNT: ${{ vars.GCP_RELEASE_CREDENTIAL_VERIFICATION_INVOKER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for variable in BROKER_URL WIF_PROVIDER INVOKER_SERVICE_ACCOUNT; do
            test -n "${!variable:-}" || { echo "missing GitHub variable: $variable" >&2; exit 1; }
          done

      - name: Obtain short-lived broker audience token
        id: broker_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: false
          workload_identity_provider: ${{ vars.GCP_RELEASE_CREDENTIAL_VERIFICATION_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_CREDENTIAL_VERIFICATION_INVOKER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_RELEASE_CREDENTIAL_VERIFICATION_BROKER_URL }}

      - name: Verify approved and rejected broker requests without token output
        shell: bash
        env:
          BROKER_URL: ${{ vars.GCP_RELEASE_CREDENTIAL_VERIFICATION_BROKER_URL }}
          BROKER_ID_TOKEN: ${{ steps.broker_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          approved_status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST "$BROKER_URL/v1/github/installations/token" \
            --header "Authorization: Bearer $BROKER_ID_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"host":"github.com","owner":"CyberT33N","repository":"git-governance"}')"
          test "$approved_status" = "200"

          rejected_status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST "$BROKER_URL/v1/github/installations/token" \
            --header "Authorization: Bearer $BROKER_ID_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"host":"github.com","owner":"CyberT33N","repository":"not-approved"}')"
          test "$rejected_status" = "403"

  release-request:
    if: ${{ inputs.operation == 'release-request' }}
    name: Authorize protected-line request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-request
    permissions:
      actions: write
      contents: read
      deployments: write
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Require approved release-request inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          KIND: ${{ inputs.kind }}
          TICKET_KEY: ${{ inputs.ticket_key }}
          TICKET: ${{ inputs.ticket }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          for variable in VERSION KIND TICKET_KEY TICKET; do
            test -n "${!variable:-}" || { echo "release-request requires $variable" >&2; exit 1; }
          done

      - name: Authorize and dispatch bound protected-line execution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_GOVERNANCE_WORKFLOW_TOKEN: server
          KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
          TICKET_KEY: ${{ inputs.ticket_key }}
          TICKET: ${{ inputs.ticket }}
          REQUESTER: ${{ github.actor }}
          PARENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          go run -mod=readonly ./cmd/git-governance \
            --interactive never \
            --output json \
            --yes \
            --pull-request-provider github \
            workflow release request \
            --kind "$KIND" \
            --version "$VERSION" \
            --key "$TICKET_KEY" \
            --ticket "$TICKET" \
            --requester "$REQUESTER" \
            --parent-run "$PARENT_RUN"

  reconciliation-align:
    if: ${{ inputs.operation == 'reconciliation-align' || inputs.operation == 'reconciliation-resume' }}
    name: Reconcile delivered release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-reconciliation
    steps:
      - name: Check out trusted control-plane source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Require approved reconciliation inputs
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          TICKET_KEY: ${{ inputs.ticket_key }}
          TICKET: ${{ inputs.ticket }}
          SLUG: ${{ inputs.slug }}
          OPERATION: ${{ inputs.operation }}
          RESOLUTION_BRANCH: ${{ inputs.resolution_branch }}
          PUBLISHER_BROKER_URL: ${{ vars.GCP_RECONCILIATION_PUBLISHER_BROKER_URL }}
          PUBLISHER_WIF_PROVIDER: ${{ vars.GCP_RECONCILIATION_PUBLISHER_WIF_PROVIDER }}
          PUBLISHER_INVOKER_SERVICE_ACCOUNT: ${{ vars.GCP_RECONCILIATION_PUBLISHER_INVOKER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          for variable in RELEASE TICKET_KEY TICKET SLUG PUBLISHER_BROKER_URL PUBLISHER_WIF_PROVIDER PUBLISHER_INVOKER_SERVICE_ACCOUNT; do
            test -n "${!variable:-}" || { echo "missing release-control input: $variable" >&2; exit 1; }
          done
          if test "$OPERATION" = "reconciliation-resume"; then
            test -n "$RESOLUTION_BRANCH" || { echo "reconciliation-resume requires resolution_branch" >&2; exit 1; }
            [[ "$RESOLUTION_BRANCH" =~ ^chore/[A-Z][A-Z0-9]*-[1-9][0-9]*-[a-z0-9]+(-[a-z0-9]+)*$ ]] ||
              { echo "resolution_branch must be a ticket-bound chore branch" >&2; exit 1; }
            test "$RESOLUTION_BRANCH" = "chore/${TICKET_KEY}-${TICKET}-${SLUG}" ||
              { echo "resolution_branch must match the supplied ticket and slug" >&2; exit 1; }
          fi

      - name: Obtain short-lived broker audience token
        id: publisher_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: false
          workload_identity_provider: ${{ vars.GCP_RECONCILIATION_PUBLISHER_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RECONCILIATION_PUBLISHER_INVOKER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_RECONCILIATION_PUBLISHER_BROKER_URL }}

      - name: Build trusted release-control binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/bin
          go build -mod=readonly -trimpath -o .build/bin/git-governance ./cmd/git-governance
          ./.build/bin/git-governance --version

      - name: Create, align, or publish governed reconciliation branch
        shell: bash
        env:
          PUBLISHER_BROKER_URL: ${{ vars.GCP_RECONCILIATION_PUBLISHER_BROKER_URL }}
          PUBLISHER_BROKER_ID_TOKEN: ${{ steps.publisher_auth.outputs.id_token }}
          RELEASE: ${{ inputs.release }}
          TICKET_KEY: ${{ inputs.ticket_key }}
          TICKET: ${{ inputs.ticket }}
          SLUG: ${{ inputs.slug }}
          OPERATION: ${{ inputs.operation }}
          RESOLUTION_BRANCH: ${{ inputs.resolution_branch }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          response="$(mktemp)"
          cleanup() {
            git config --local --unset-all http.https://github.com/.extraheader || true
            rm -f "$response"
          }
          trap cleanup EXIT

          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST "$PUBLISHER_BROKER_URL/v1/github/installations/token" \
            --header "Authorization: Bearer $PUBLISHER_BROKER_ID_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"host":"github.com","owner":"CyberT33N","repository":"git-governance"}')"
          test "$status" = "200"
          transport_token="$(jq --exit-status --raw-output '.access_token' "$response")"
          test -n "$transport_token"
          echo "::add-mask::$transport_token"
          transport_header="$(printf 'x-access-token:%s' "$transport_token" | base64 --wrap=0)"
          echo "::add-mask::$transport_header"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $transport_header"

          export GIT_GOVERNANCE_GITHUB_CREDENTIAL_BROKER_URL="$PUBLISHER_BROKER_URL"
          export GIT_GOVERNANCE_WORKLOAD_IDENTITY_TOKEN="$PUBLISHER_BROKER_ID_TOKEN"
          export GIT_TERMINAL_PROMPT=0

          if test "$OPERATION" = "reconciliation-align"; then
            ./.build/bin/git-governance \
              --interactive never \
              --output json \
              --yes \
              --pull-request-provider github \
              workflow release stabilize \
              --release "$RELEASE" \
              --kind release-prep \
              --key "$TICKET_KEY" \
              --ticket "$TICKET" \
              --slug "$SLUG"

            ./.build/bin/git-governance \
              --interactive never \
              --output json \
              --yes \
              --pull-request-provider github \
              workflow release align-reconciliation-base \
              --release "$RELEASE" \
              --push \
              --create-pull-request
            exit 0
          fi

          git fetch origin "refs/heads/$RESOLUTION_BRANCH:refs/remotes/origin/$RESOLUTION_BRANCH"
          git switch --create "$RESOLUTION_BRANCH" --track "origin/$RESOLUTION_BRANCH"

          ./.build/bin/git-governance \
            --interactive never \
            --output json \
            branch validate \
            --branch "$RESOLUTION_BRANCH"

          ./.build/bin/git-governance \
            --interactive never \
            --output json \
            --yes \
            --pull-request-provider github \
            workflow release align-reconciliation-base \
            --branch "$RESOLUTION_BRANCH" \
            --release "$RELEASE" \
            --prepared \
            --push \
            --create-pull-request
