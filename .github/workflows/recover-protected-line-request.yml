name: Recover Protected-Line Request

run-name: Recover protected-line request ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Durable request identifier currently awaiting read-only recovery finalization.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: protected-line-request-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'CyberT33N/git-governance' && github.ref == 'refs/heads/main'
    name: Recover bound protected-line request
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted recovery finalizer source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Read-only recover the verification-pending request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_GOVERNANCE_WORKFLOW_TOKEN: server
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          go run -mod=readonly ./cmd/git-governance \
            --interactive never \
            --output json \
            --yes \
            --pull-request-provider github \
            workflow release finalize-request \
            --request-id "$REQUEST_ID" \
            --recovery
