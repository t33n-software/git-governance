name: Reusable Publish Release Artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable v<semver> tag to release.
        required: true
        type: string
      delivery_variant:
        description: The bound delivery variant of the tenant.
        required: true
        type: choice
        options:
          - cloud
          - github-only
      delivery_environment:
        description: Protected environment of the release-delivery lane.
        required: true
        type: string
      repository:
        description: The bound repository the delivery lane is authorized to publish; validated fail-closed.
        required: true
        type: string
      source_gate:
        description: The canonical source-verification gate of the tenant.
        required: true
        type: choice
        options:
          - build
          - quality-gate

permissions: {}

jobs:
  deliver-cloud:
    if: ${{ inputs.delivery_variant == 'cloud' }}
    name: Deliver release artifacts (cloud)
    runs-on: ubuntu-24.04
    environment: ${{ inputs.delivery_environment }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOVCS: "*:off"
    steps:
      - name: Bind the running repository
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ inputs.repository }}
          DELIVERY_ENVIRONMENT: ${{ inputs.delivery_environment }}
        run: |
          set -euo pipefail
          test -n "$DELIVERY_ENVIRONMENT" || { echo "publish-release-artifacts requires delivery_environment" >&2; exit 1; }
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY" || {
            echo "the release-delivery lane is bound to $EXPECTED_REPOSITORY, not $GITHUB_REPOSITORY" >&2
            exit 1
          }

      - name: Check out immutable release source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG is not a valid v<semver> release tag."
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          test "${tag_commit}" = "$(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Verify controlled Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"
          expected="$(go mod edit -json | jq --exit-status --raw-output '.Toolchain // .Go')"
          test "$(go env GOVERSION)" = "$expected"

      - name: Verify release source
        shell: bash
        env:
          SOURCE_GATE: ${{ inputs.source_gate }}
        run: |
          set -euo pipefail
          case "$SOURCE_GATE" in
            build)
              go run -mod=readonly ./cmd/build
              ;;
            quality-gate)
              go tool -modfile tools/go.mod quality-gate
              ;;
            *)
              echo "unknown source gate: $SOURCE_GATE" >&2
              exit 1
              ;;
          esac

      - name: Install Syft for GoReleaser SBOM generation
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.46.0

      - name: Install Cosign for checksum signing
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v3.0.6

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.16.0
          args: check

      - name: Build, package, sign, and publish
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release artifact set
        shell: bash
        run: |
          set -euo pipefail
          checksum="$(find dist -type f -name '*checksums.txt' -print -quit)"
          test -n "${checksum}"
          test -n "$(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          test -n "$(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' \) -print -quit)"
          test -n "$(find dist -type f -name '*.sigstore.json' -print -quit)"
          test -n "$(find dist -type f \( -name '*.sbom.json' -o -name '*.spdx.json' \) -print -quit)"
          (
            cd "$(dirname "${checksum}")"
            sha256sum --check "$(basename "${checksum}")"
          )

      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "dist/**"

  deliver-github:
    if: ${{ inputs.delivery_variant == 'github-only' }}
    name: Deliver release artifacts (github-only)
    runs-on: ubuntu-24.04
    environment: ${{ inputs.delivery_environment }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOVCS: "*:off"
    steps:
      - name: Bind the running repository
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ inputs.repository }}
          DELIVERY_ENVIRONMENT: ${{ inputs.delivery_environment }}
        run: |
          set -euo pipefail
          test -n "$DELIVERY_ENVIRONMENT" || { echo "publish-release-artifacts requires delivery_environment" >&2; exit 1; }
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY" || {
            echo "the release-delivery lane is bound to $EXPECTED_REPOSITORY, not $GITHUB_REPOSITORY" >&2
            exit 1
          }

      - name: Check out immutable release source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG is not a valid v<semver> release tag."
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          test "${tag_commit}" = "$(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Verify controlled Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"
          expected="$(go mod edit -json | jq --exit-status --raw-output '.Toolchain // .Go')"
          test "$(go env GOVERSION)" = "$expected"

      - name: Verify release source
        shell: bash
        env:
          SOURCE_GATE: ${{ inputs.source_gate }}
        run: |
          set -euo pipefail
          case "$SOURCE_GATE" in
            build)
              go run -mod=readonly ./cmd/build
              ;;
            quality-gate)
              go tool -modfile tools/go.mod quality-gate
              ;;
            *)
              echo "unknown source gate: $SOURCE_GATE" >&2
              exit 1
              ;;
          esac

      - name: Write the release source manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git ls-files -z | sort -z | xargs -0 sha256sum > "dist/source-manifest-${TAG}.txt"
          test -s "dist/source-manifest-${TAG}.txt"

      - name: Attest the release source manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "dist/source-manifest-*.txt"

      - name: Create the GitHub release with the provenance-bound manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            "dist/source-manifest-${TAG}.txt"
